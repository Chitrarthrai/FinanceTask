name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest
    environment: frontend
    permissions:
      contents: write # Required to create a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create .env file for mobile build
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_CHAT_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_CHAT_API_KEY }}
          EXPO_PUBLIC_GEMINI_NOTES_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_NOTES_API_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const keys = [
              "EXPO_PUBLIC_SUPABASE_URL",
              "EXPO_PUBLIC_SUPABASE_ANON_KEY",
              "EXPO_PUBLIC_GEMINI_API_KEY",
              "EXPO_PUBLIC_GEMINI_CHAT_API_KEY",
              "EXPO_PUBLIC_GEMINI_NOTES_API_KEY"
            ];
            const content = keys.map(k => `${k}=${process.env[k] || ""}`).join("\n");
            fs.writeFileSync(".env", content);
            console.log("Successfully created .env file with keys:", keys);
          '

      - name: Make gradlew executable
        working-directory: ./mobile/android
        run: chmod +x ./gradlew

      - name: Build Android Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_CHAT_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_CHAT_API_KEY }}
          EXPO_PUBLIC_GEMINI_NOTES_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_NOTES_API_KEY }}

      - name: Package Universal APK for Release
        working-directory: ./mobile
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release/ -name "*Universal*.apk" -exec cp {} dist/FinanceTask-Universal.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/FinanceTask-Universal.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
